name: Honeycomb Quality Gate - Enhanced

on:
  push:
    branches: [main, 'upgrade/**', 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: honeycomb-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python / Node / Shell / Security Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      - name: Install Python quality dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx python-dotenv pydantic pytest pytest-cov mypy pyright

      - name: Install Node dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Node typecheck
        if: hashFiles('package.json') != ''
        run: npm run typecheck

      - name: Node tests
        if: hashFiles('package.json') != ''
        run: npm test

      - name: Python type checking (mypy advisory; not a release gate)
        run: |
          set +e
          mypy honeycomb_execution_guard.py --strict --no-implicit-optional 2>&1 | tee mypy-report.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::warning::mypy reported issues; this advisory step is not counted as a passing type gate."
          else
            echo "mypy reported no issues for honeycomb_execution_guard.py"
          fi
          exit 0

      - name: Python type checking (pyright advisory; not a release gate)
        run: |
          set +e
          pyright honeycomb_execution_guard.py --outputjson > pyright-report.json
          status=$?
          cat pyright-report.json
          if [ "$status" -ne 0 ]; then
            echo "::warning::pyright reported issues; this advisory step is not counted as a passing type gate."
          else
            echo "pyright reported no issues for honeycomb_execution_guard.py"
          fi
          exit 0

      - name: Python compile gate
        run: |
          python - <<'PY'
          import os
          import pathlib
          import py_compile
          import sys
          import time
          
          start = time.time()
          root = pathlib.Path(os.environ.get("GITHUB_WORKSPACE", ".")).resolve()
          excluded = {".git", "node_modules", "__pycache__", "backups", ".honeycomb_tools", ".honeycomb_runtime"}
          files = [
              p for p in root.rglob("*.py")
              if not any(
                  part == "backups"
                  or part == ".honeycomb_tools"
                  or part.startswith(".honeycomb_recovery_DISABLED_")
                  or part.endswith("_backups")
                  for part in p.relative_to(root).parts
              )
              and not any(part in excluded for part in p.relative_to(root).parts)
          ]
          failures = []
          
          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append((str(path), str(exc)))
          
          elapsed = time.time() - start
          
          if failures:
              for path, error in failures:
                  print(f'PY_COMPILE_FAIL {path}: {error}', file=sys.stderr)
              raise SystemExit(1)
          
          print(f'✅ Compiled {len(files)} Python files in {elapsed:.2f}s')
          print(f'   Avg: {elapsed/len(files)*1000:.1f}ms per file')
          PY

      - name: Shell syntax gate
        run: |
          files=(run_nexus_testnet.sh run_honeycomb_ui.sh runtime/start_testnet.sh)
          total=0
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              bash -n "$file" && echo "✅ $file syntax OK" || exit 1
              total=$((total+1))
            fi
          done
          echo "✅ All $total shell scripts passed syntax check"

      - name: Action workflow lint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7

            - name: Live kernel safety and fill-contract unit tests (no network calls)
        run: python3 -m unittest discover -s tests -p 'test_live_*.py' -v

      - name: Local rate limiter throughput check (not exchange latency)
        run: |
          python3 <<'RATE_LIMITER'
          import math
          import time
          from live.kernel import TokenBucket

          bucket = TokenBucket(wpm=1_000_000.0, o10=1_000_000.0)
          start = time.perf_counter()
          operations = 10_000
          for _ in range(operations):
              bucket.take(weight=1)
          elapsed = time.perf_counter() - start
          throughput = operations / elapsed if elapsed > 0 else float("inf")
          if not math.isfinite(throughput) or throughput <= 0:
              raise SystemExit("Rate limiter throughput measurement is invalid")
          print(f"Local TokenBucket throughput: {throughput:.0f} operations/s")
          print("This is a local code-path measurement, not exchange order latency or production performance.")
          RATE_LIMITER

      # ========== 新增: DATABASE INTEGRITY ==========
      - name: SQLite Database Integrity Check
        run: |
          python3 <<'DB_INTEGRITY'
          import sqlite3
          import os
          import sys
          
          CACHE_DB = ".honeycomb_runtime/market_cache.db"
          
          if os.path.exists(CACHE_DB):
              print(f"\n[DB] Integrity Check: {CACHE_DB}")
              
              try:
                  con = sqlite3.connect(CACHE_DB, timeout=10)
                  
                  # 1. Integrity check
                  result = con.execute("PRAGMA integrity_check").fetchone()[0]
                  if result == "ok":
                      print(f"  ✅ Database integrity: OK")
                  else:
                      print(f"  ❌ Database corrupted: {result}")
                      sys.exit(1)
                  
                  # 2. Schema validation
                  tables = ["kv", "book", "mark", "kline"]
                  for table in tables:
                      check = con.execute(
                          f"SELECT name FROM sqlite_master WHERE type='table' AND name='{table}'"
                      ).fetchone()
                      if check:
                          print(f"  ✅ Table {table}: exists")
                      else:
                          print(f"  ⚠️ Table {table}: missing (will be created on startup)")
                  
                  con.close()
              except Exception as e:
                  print(f"  ⚠️ DB check skipped: {e}")
          else:
              print("\\n[DB] NOT RUN: no runtime SQLite database was provisioned in CI; no database-integrity claim is made.")
          DB_INTEGRITY

      # ========== 新增: SECURITY CHECKS ==========
      - name: Secret Leak Detection
        run: |
          python3 <<'SECRET_SCAN'
          import re
          import sys
          from pathlib import Path
          
          print("\n[SECURITY] Secret Leak Detection")
          
          # Patterns to avoid
          dangerous_patterns = [
              (r"BINANCE_API_KEY\s*=\s*['\"]([a-zA-Z0-9]{40,})['\"]", "Hardcoded API Key"),
              (r"BINANCE_SECRET\s*=\s*['\"]([a-zA-Z0-9]{40,})['\"]", "Hardcoded Secret"),
              (r"LIVE_ARMED\s*=\s*['\"]1['\"]", "Hardcoded LIVE mode"),
          ]
          
          leaked_files = []
          
          for file_path in Path('.').rglob('*.py'):
              if any(x in str(file_path) for x in ['.git', 'node_modules', '.env', 'test']):
                  continue
              
              try:
                  content = file_path.read_text(errors='ignore')
                  for pattern, name in dangerous_patterns:
                      if re.search(pattern, content, re.IGNORECASE):
                          leaked_files.append((file_path, name))
              except:
                  pass
          
          if leaked_files:
              print(f"  ❌ {len(leaked_files)} potential leaks:")
              for f, desc in leaked_files:
                  print(f"     - {f}: {desc}")
              sys.exit(1)
          else:
              print(f"  ✅ No hardcoded secrets detected")
          
          # Verify env-only pattern
          result = 0
          for file_path in Path('.').rglob('*.py'):
              if '.env' in str(file_path):
                  continue
              if any(x in str(file_path) for x in ['.git', 'node_modules', 'test']):
                  continue
              content = file_path.read_text(errors='ignore')
              if re.search(r'os\.getenv\(["\']BINANCE_(API_KEY|SECRET)', content):
                  print(f"  ✅ {file_path}: using os.getenv() for secrets")
              
          SECRET_SCAN

      - name: LIVE Mode Safety Guard
        run: |
          python3 <<'LIVE_GUARD'
          import os
          import sys
          
          print("\n[SAFETY] LIVE Mode Guard")
          
          if os.getenv('LIVE_ARMED') == '1':
              print("  ❌ LIVE_ARMED must never be enabled in CI.")
              print("  This workflow validates code; it must not be able to submit production orders.")
              sys.exit(1)
          else:
              print("  LIVE_ARMED is unset. CI validates code safety only; it does not prove live readiness or exchange connectivity.")
          
          LIVE_GUARD

      - name: Upload Workflow Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: honeycomb-quality-report
          path: |
            mypy-report.txt
            pyright-report.json
          retention-days: 30

