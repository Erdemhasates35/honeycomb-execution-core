name: Honeycomb Quality Gate

on:
  push:
    branches: [main, 'upgrade/**', 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: honeycomb-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python / Node / Shell Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      - name: Install Python quality dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx python-dotenv pydantic pytest

      - name: Install Node dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Node typecheck
        if: hashFiles('package.json') != ''
        run: npm run typecheck

      - name: Node tests
        if: hashFiles('package.json') != ''
        run: npm test

      - name: Python compile gate
        run: |
          python - <<'PY'
          import os
          import pathlib
          import py_compile
          import sys
          root = pathlib.Path(os.environ.get("GITHUB_WORKSPACE", ".")).resolve()
          excluded = {".git", "node_modules", "__pycache__", "backups", ".honeycomb_tools", ".honeycomb_runtime"}
          files = [
              p for p in root.rglob("*.py")
              if not any(part == "backups" or part == ".honeycomb_tools" or part.startswith(".honeycomb_recovery_DISABLED_") or part.endswith("_backups") for part in p.relative_to(root).parts)
              and not any(part in excluded for part in p.relative_to(root).parts)
          ]
          failures = []
          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append((str(path), str(exc)))
          if failures:
              for path, error in failures:
                  print(f'PY_COMPILE_FAIL {path}: {error}', file=sys.stderr)
              raise SystemExit(1)
          print(f'Compiled {len(files)} Python files successfully.')
          PY

      - name: Shell syntax gate
        run: |
          files=(run_nexus_testnet.sh run_honeycomb_ui.sh runtime/start_testnet.sh)
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then bash -n "$file"; fi
          done

      - name: Action workflow lint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
