<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HONEYCOMB / QUANTUM NEXUS</title><style>:root{color-scheme:dark;--bg:#080a0d;--panel:#101419;--line:#252b33;--text:#e6edf3;--muted:#7f8b98;--ok:#43d17a;--warn:#e4b84a;--bad:#ff5f68}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:12px ui-monospace,SFMono-Regular,Menlo,monospace}header{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;background:#0a0d11;z-index:2}.brand{font-weight:800;letter-spacing:.08em}.mode{display:flex;gap:5px}.mode button{background:#141a20;color:#aeb8c2;border:1px solid var(--line);padding:5px 8px;border-radius:4px;font:inherit}.mode button.active{border-color:var(--ok);color:var(--ok)}main{padding:12px;max-width:1500px;margin:auto}.grid{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:8px}.card{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px;min-width:0}.label{color:var(--muted);font-size:10px}.value{font-size:18px;font-weight:800;margin-top:6px;overflow:hidden;text-overflow:ellipsis}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.layout{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:8px}.section{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px;overflow:auto}.title{font-weight:800;margin-bottom:8px}.row{display:flex;justify-content:space-between;border-top:1px solid #1b2026;padding:6px 0;gap:10px}.pill{padding:2px 5px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-top:1px solid #1b2026;padding:6px 4px;white-space:nowrap}th{color:var(--muted);font-size:10px}.scroll{max-height:390px;overflow:auto}pre{white-space:pre-wrap;word-break:break-word;margin:0;color:#aeb8c2;max-height:280px;overflow:auto}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.value{font-size:15px}}</style></head><body><header><div class="brand">HONEYCOMB // QUANTUM NEXUS</div><div id="backend">BACKEND: CHECKING</div><div class="mode" id="modes"><button data-mode="TESTNET">TESTNET</button><button data-mode="PAPER">PAPER</button><button data-mode="SHADOW">SHADOW</button><button data-mode="LIVE">LIVE</button></div></header><main><div class="grid" id="kpis"></div><div class="layout"><section class="section"><div class="title">SYSTEM / EXECUTION TELEMETRY</div><div id="services"></div></section><section class="section"><div class="title">ECONOMICS / EXECUTION SNAPSHOT</div><pre id="summary">—</pre></section></div><div class="layout"><section class="section"><div class="title">AGENT PARLIAMENT · 25</div><div class="scroll"><table><thead><tr><th>#</th><th>AGENT</th><th>ROLE</th><th>STATE</th></tr></thead><tbody id="agents"></tbody></table></div></section><section class="section"><div class="title">ENGINE INVENTORY</div><pre id="engines">—</pre></section></div><div class="layout"><section class="section"><div class="title">QUALITY GATE</div><pre id="quality">—</pre></section><section class="section"><div class="title">RECENT LOGS</div><pre id="logs">—</pre></section></div></main><script>const AGENTS=['Supervisor','Market Regime','Trend','Momentum','Volatility','Order Flow','Order Book','Volume','Funding','Open Interest','Liquidation','Basis','Stat Arb','Cross-Exchange Arb','Mean Reversion','Breakout','Scalping','Position Management','Portfolio','Risk Analysis','Cost/Fee','Execution Quality','Anomaly Detection','Post-Trade Analysis','Self-Healing/Evolution'];const esc=v=>String(v??'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const card=(k,v,state='ok')=>`<div class="card"><div class="label">${esc(k)}</div><div class="value ${state}">${esc(v)}</div></div>`;async function get(path){const r=await fetch(path,{cache:'no-store'});const j=await r.json();return{status:r.status,data:j}}function setMode(mode){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}async function changeMode(mode){const r=await fetch('/api/ui/mode',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode})});const j=await r.json();if(!r.ok)alert(j.error||'MODE_CHANGE_REJECTED');await tick()}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>changeMode(b.dataset.mode));async function tick(){try{const [st,ov,pos,br,eng,q,logs,cap]=await Promise.all([get('/api/ui/status'),get('/api/ui/overview'),get('/api/ui/positions'),get('/api/ui/bridge-status'),get('/api/ui/engines'),get('/api/ui/quality'),get('/api/ui/logs'),get('/api/ui/capabilities')]);const s=st.data||{},summary=ov.data||{},bridge=br.data||{},mode=String(s.mode||'UNKNOWN').toUpperCase(),ports=s.execution_ports||{},quality=s.quality?.summary||{};setMode(mode);document.getElementById('backend').textContent=`CONTROL ${st.status===200?'OK':'DOWN'} · BRIDGE ${br.status===200?'OK':'DOWN'}`;document.getElementById('kpis').innerHTML=[card('MODE',mode,mode==='LIVE'?'warn':'ok'),card('ENGINES',s.engine_count??'—'),card('SOURCE FILES',s.source_file_count??'—'),card('ENGINE :8000',ports['8000']?'UP':'DOWN',ports['8000']?'ok':'bad'),card('BRIDGE :8100',ports['8100']?'UP':'DOWN',ports['8100']?'ok':'bad'),card('QUALITY',quality.repository_score??'—'),card('CORE 9+',quality.core_9plus?'PASS':'FAIL',quality.core_9plus?'ok':'bad'),card('GIT',s.git?.dirty?'DIRTY':'CLEAN',s.git?.dirty?'warn':'ok')].join('');document.getElementById('services').innerHTML=[['CONTROL',st.status],['ENGINE',ports['8000']?200:503],['BRIDGE',br.status],['DATABASE',Array.isArray(s.databases)?'REPORTED':'UNAVAILABLE'],['MARKET DATA',summary?'REPORTED':'UNAVAILABLE'],['EXECUTION',bridge.engine?.online?'ONLINE':'UNAVAILABLE']].map(([k,v])=>`<div class="row"><span>${esc(k)}</span><span class="pill">${esc(v)}</span></div>`).join('');document.getElementById('summary').textContent=JSON.stringify({summary,positions_count:Array.isArray(pos.data)?pos.data.length:'UNAVAILABLE',bridge,capabilities:cap.data},null,2);document.getElementById('agents').innerHTML=AGENTS.map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a)}</td><td>configured parliament role</td><td><span class="pill">NOT_REPORTED</span></td></tr>`).join('');document.getElementById('engines').textContent=Array.isArray(eng.data)?eng.data.map(x=>`${x.path} | score=${x.score} | sha256=${x.sha256}`).join('\n'):'UNAVAILABLE';document.getElementById('quality').textContent=JSON.stringify(s.quality||q.data||{},null,2);document.getElementById('logs').textContent=Array.isArray(logs.data)?logs.data.map(x=>`[${x.file}] ${x.line}`).join('\n'):'UNAVAILABLE'}catch(e){document.getElementById('backend').textContent='BACKEND: UNAVAILABLE'}}tick();setInterval(tick,2000);</script></body></html>
